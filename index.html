<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학생 관리 - English Academy</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<style>
  @font-face {
    font-family: 'Pretendard';
    src: url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/woff2/PretendardVariable.woff2') format('woff2-variations');
    font-weight: 45 920;
  }

  :root{
    --bg: #F6F5F1;
    --surface: #FFFFFF;
    --ink: #1F2A24;
    --ink-soft: #5B6862;
    --line: #E3E1D9;
    --teal: #2F6F63;
    --teal-deep: #1F4E45;
    --amber: #E4A733;
    --amber-soft: #FBEBC9;
    --danger: #C05A4E;
    --radius: 14px;
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Pretendard', -apple-system, 'Malgun Gothic', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap{ max-width: 1080px; margin: 0 auto; padding: 32px 20px 80px; }

  .top{
    display:flex; align-items:flex-end; justify-content:space-between;
    gap: 16px; flex-wrap: wrap;
    margin-bottom: 28px;
  }
  .brand-eyebrow{
    font-size: 13px; letter-spacing: .08em; color: var(--teal);
    font-weight: 700; text-transform: uppercase; margin: 0 0 4px;
  }
  .brand-title{ font-size: 28px; font-weight: 800; margin: 0; letter-spacing: -0.01em; }
  .brand-sub{ font-size: 14px; color: var(--ink-soft); margin-top: 6px; }

  .btn{
    appearance:none; border:none; cursor:pointer;
    font-family: inherit; font-weight: 700; font-size: 14px;
    padding: 11px 18px; border-radius: 10px;
    display:inline-flex; align-items:center; gap:6px;
    transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
  }
  .btn:active{ transform: scale(0.97); }
  .btn-primary{ background: var(--teal); color: #fff; box-shadow: 0 4px 14px rgba(47,111,99,.28); }
  .btn-primary:hover{ background: var(--teal-deep); }
  .btn-ghost{ background: transparent; color: var(--ink-soft); border:1px solid var(--line); }
  .btn-ghost:hover{ background: #fff; }
  .btn-danger{ background: transparent; color: var(--danger); border:1px solid #EAD3CF; }
  .btn-danger:hover{ background: #FBEEEC; }
  .btn-sm{ padding: 6px 10px; font-size: 12.5px; border-radius: 8px; }

  .panel{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
  }

  .toolbar{
    display:flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; align-items:center;
  }
  .search{
    flex: 1; min-width: 200px;
    display:flex; align-items:center; gap:8px;
    background: var(--bg); border:1px solid var(--line);
    border-radius: 10px; padding: 9px 14px;
  }
  .search input{
    border:none; background:transparent; outline:none; width:100%;
    font-family:inherit; font-size: 14px; color: var(--ink);
  }
  select.filter{
    font-family: inherit; font-size: 14px; padding: 9px 12px;
    border-radius: 10px; border:1px solid var(--line); background: var(--bg); color: var(--ink);
  }

  .stat-row{ display:flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
  .stat{
    flex: 1; min-width: 120px;
    background: var(--surface); border:1px solid var(--line); border-radius: 12px;
    padding: 14px 16px;
  }
  .stat .num{ font-size: 22px; font-weight: 800; }
  .stat .label{ font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }

  table{ width:100%; border-collapse: collapse; font-size: 14px; }
  thead th{
    text-align:left; font-size: 12.5px; color: var(--ink-soft);
    font-weight: 700; padding: 10px 12px; border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  tbody td{ padding: 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tbody tr:hover{ background: #FAFAF7; }
  tbody tr:last-child td{ border-bottom: none; }

  .name-cell{ font-weight: 700; }
  .badge{
    display:inline-block; font-size: 12px; font-weight: 700;
    padding: 3px 10px; border-radius: 999px;
  }
  .badge.on{ background: var(--amber-soft); color: #8A6512; }
  .badge.off{ background: #EFEFEA; color: #8A8A80; }

  .empty{ text-align:center; padding: 50px 20px; color: var(--ink-soft); }
  .empty .big{ font-size: 40px; margin-bottom: 6px; }

  /* Modal */
  .overlay{
    position: fixed; inset: 0; background: rgba(20,26,22,.45);
    display:none; align-items:center; justify-content:center; padding: 20px; z-index: 50;
  }
  .overlay.show{ display:flex; }
  .modal{
    background: var(--surface); border-radius: 16px; width: 100%; max-width: 520px;
    max-height: 88vh; overflow-y: auto; padding: 26px;
    box-shadow: 0 20px 60px rgba(0,0,0,.2);
  }
  .modal h2{ margin: 0 0 18px; font-size: 19px; font-weight: 800; }
  .field{ margin-bottom: 14px; }
  .field label{ display:block; font-size: 13px; font-weight: 700; color: var(--ink-soft); margin-bottom: 6px; }
  .field input, .field select, .field textarea{
    width: 100%; font-family: inherit; font-size: 14px;
    padding: 10px 12px; border-radius: 9px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); outline: none;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ border-color: var(--teal); }
  .row2{ display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .modal-actions{ display:flex; justify-content:flex-end; gap: 10px; margin-top: 20px; }

  .toast{
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 10px;
    font-size: 14px; font-weight: 600; opacity: 0; pointer-events:none;
    transition: opacity .25s ease, transform .25s ease; z-index: 100;
  }
  .toast.show{ opacity: 1; transform: translateX(-50%) translateY(-6px); }

  @media (max-width: 640px){
    .row2{ grid-template-columns: 1fr; }
    table, thead, tbody, th, td, tr{ display:block; }
    thead{ display:none; }
    tbody tr{ border-bottom: 1px solid var(--line); padding: 12px 0; }
    tbody td{ border-bottom:none; padding: 4px 4px; display:flex; justify-content:space-between; gap:12px; }
    tbody td::before{ content: attr(data-label); font-weight:700; color: var(--ink-soft); font-size:12.5px; }
  }
</style>
</head>
<body>

<!-- 로그인 화면 -->
<div id="loginScreen" style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;">
  <div class="panel" style="max-width:380px; width:100%;">
    <p class="brand-eyebrow">Student Records</p>
    <h1 class="brand-title" style="margin-bottom:20px;">로그인</h1>
    <div class="field">
      <label>이메일</label>
      <input type="email" id="loginEmail" placeholder="teacher1@academy.local">
    </div>
    <div class="field">
      <label>비밀번호</label>
      <input type="password" id="loginPassword" placeholder="비밀번호">
    </div>
    <button class="btn btn-primary" id="loginBtn" style="width:100%; justify-content:center; margin-top:6px;">로그인</button>
    <p id="loginError" style="color:var(--danger); font-size:13px; margin-top:10px; display:none;"></p>
  </div>
</div>

<!-- 메인 화면 (로그인 후에만 보임) -->
<div class="wrap" id="mainScreen" style="display:none;">
  <div class="top">
    <div>
      <p class="brand-eyebrow">Student Records</p>
      <h1 class="brand-title">학생 관리</h1>
      <p class="brand-sub">우리 학원 학생들의 기본 정보를 관리해요</p>
    </div>
    <div style="display:flex; gap:10px; align-items:center;">
      <button class="btn btn-ghost" id="logoutBtn">로그아웃</button>
      <button class="btn btn-primary" id="openAddBtn">+ 학생 추가</button>
    </div>
  </div>

  <div style="display:flex; gap:8px; margin-bottom:20px;">
    <button class="btn btn-primary tabBtn" id="tabStudents">학생 명단</button>
    <button class="btn btn-ghost tabBtn" id="tabAttendance">출결 체크</button>
    <button class="btn btn-ghost tabBtn" id="tabTuition">학원비 관리</button>
    <button class="btn btn-ghost tabBtn" id="tabCounseling">상담 관리</button>
  </div>

  <div id="studentsView">
    <div class="stat-row" id="statRow"></div>

    <div class="panel">
      <div class="toolbar">
        <div class="search">
          <span>🔎</span>
          <input type="text" id="searchInput" placeholder="이름으로 검색">
        </div>
        <select class="filter" id="statusFilter">
          <option value="all">전체 상태</option>
          <option value="재원">재원</option>
          <option value="퇴원">퇴원</option>
        </select>
      </div>

      <div id="tableArea">
        <table>
          <thead>
            <tr>
              <th>이름</th>
              <th>반</th>
              <th>학년</th>
              <th>생년월일</th>
              <th>학생 연락처</th>
              <th>학부모 연락처</th>
              <th>입학일</th>
              <th>상태</th>
              <th>관리</th>
              <th>메모</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
        <div class="empty" id="emptyState" style="display:none;">
          <div class="big">🗂️</div>
          학생 정보가 아직 없어요. 오른쪽 위 [+ 학생 추가]로 시작해보세요.
        </div>
      </div>
    </div>
  </div>

  <div id="attendanceView" style="display:none;">
    <div class="panel">
      <div class="toolbar">
        <div class="search" style="max-width:220px;">
          <span>📅</span>
          <input type="date" id="attDate">
        </div>
        <select class="filter" id="attClassFilter">
          <option value="all">전체 반</option>
        </select>
      </div>
      <div id="attArea"></div>
      <p style="font-size:12.5px; color:var(--ink-soft); margin-top:12px;">💡 선택된 버튼(진한 초록색)을 다시 누르면 체크가 취소돼요.</p>
    </div>
  </div>

  <div id="tuitionView" style="display:none;">
    <div class="stat-row" id="tuitionStatRow"></div>
    <div class="panel">
      <div class="toolbar">
        <div class="search" style="max-width:180px;">
          <span>📅</span>
          <input type="month" id="tuitionMonth">
        </div>
        <select class="filter" id="tuitionStatusFilter">
          <option value="all">전체 상태</option>
          <option value="미납">미납</option>
          <option value="납부완료">납부완료</option>
        </select>
        <div style="margin-left:auto; display:flex; gap:10px;">
          <button class="btn btn-ghost" id="genTuitionBtn">이번달 일괄생성</button>
          <button class="btn btn-primary" id="openTuitionAddBtn">+ 학원비 추가</button>
        </div>
      </div>
      <div id="tuitionArea"></div>
    </div>
  </div>

  <div id="counselingView" style="display:none;">
    <div style="display:flex; gap:8px; margin-bottom:16px;">
      <button class="btn btn-primary tabBtn" id="subTabNewInquiry">신규상담</button>
      <button class="btn btn-ghost tabBtn" id="subTabCounseling">재원상담</button>
    </div>

    <!-- 신규상담 -->
    <div id="newInquiryView">
      <div class="panel">
        <div class="toolbar">
          <div class="search">
            <span>🔎</span>
            <input type="text" id="inquirySearchInput" placeholder="이름으로 검색">
          </div>
          <select class="filter" id="inquiryStatusFilter">
            <option value="all">전체 상태</option>
            <option value="상담중">상담중</option>
            <option value="등록완료">등록완료</option>
            <option value="보류">보류</option>
            <option value="미등록">미등록</option>
          </select>
          <button class="btn btn-primary" id="openInquiryAddBtn" style="margin-left:auto;">+ 신규상담 추가</button>
        </div>
        <div id="inquiryArea"></div>
      </div>
    </div>

    <!-- 재원상담 -->
    <div id="existingCounselingView" style="display:none;">
      <div class="panel">
        <div class="toolbar">
          <select class="filter" id="counselingStudentFilter">
            <option value="all">전체 학생</option>
          </select>
          <button class="btn btn-primary" id="openCounselingAddBtn" style="margin-left:auto;">+ 상담 추가</button>
        </div>
        <div id="counselingArea"></div>
      </div>
    </div>
  </div>
</div>

<!-- 신규상담 추가/수정 모달 -->
<div class="overlay" id="inquiryOverlay">
  <div class="modal">
    <h2 id="inquiryModalTitle">신규상담 추가</h2>
    <input type="hidden" id="if_id">
    <div class="row2">
      <div class="field">
        <label>이름 *</label>
        <input type="text" id="if_name" placeholder="예: 이서준">
      </div>
      <div class="field">
        <label>상태</label>
        <select id="if_status">
          <option value="상담중">상담중</option>
          <option value="등록완료">등록완료</option>
          <option value="보류">보류</option>
          <option value="미등록">미등록</option>
        </select>
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>연락처</label>
        <input type="text" id="if_phone" placeholder="010-0000-0000">
      </div>
      <div class="field">
        <label>학부모 연락처</label>
        <input type="text" id="if_pphone" placeholder="010-0000-0000">
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>관심 반/레벨</label>
        <input type="text" id="if_interested" placeholder="예: 초등 3반">
      </div>
      <div class="field">
        <label>유입 경로</label>
        <input type="text" id="if_source" placeholder="예: 지인소개, 전단지">
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>상담일</label>
        <input type="date" id="if_date">
      </div>
      <div class="field">
        <label>상담자</label>
        <input type="text" id="if_counselor" placeholder="예: 김원장">
      </div>
    </div>
    <div class="field">
      <label>상담 내용</label>
      <textarea id="if_content" rows="2"></textarea>
    </div>
    <div class="row2">
      <div class="field">
        <label>레벨테스트 결과</label>
        <input type="text" id="if_leveltest" placeholder="예: Level 2 적합">
      </div>
      <div class="field">
        <label>배정 반</label>
        <input type="text" id="if_assigned" placeholder="예: 초등 3반">
      </div>
    </div>
    <div class="field">
      <label>다음 상담(예정)일</label>
      <input type="date" id="if_nextdate">
    </div>
    <div class="field">
      <label>메모</label>
      <textarea id="if_memo" rows="2"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="inquiryCancelBtn">취소</button>
      <button class="btn btn-primary" id="inquirySaveBtn">저장</button>
    </div>
  </div>
</div>

<!-- 재원상담 추가/수정 모달 -->
<div class="overlay" id="counselingOverlay">
  <div class="modal">
    <h2 id="counselingModalTitle">상담 추가</h2>
    <input type="hidden" id="cf_id">
    <div class="field">
      <label>학생 *</label>
      <select id="cf_student"></select>
    </div>
    <div class="row2">
      <div class="field">
        <label>상담일</label>
        <input type="date" id="cf_date">
      </div>
      <div class="field">
        <label>방식</label>
        <select id="cf_type">
          <option value="전화">전화</option>
          <option value="방문">방문</option>
          <option value="문자/카톡">문자/카톡</option>
          <option value="기타">기타</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>상담자</label>
      <input type="text" id="cf_counselor" placeholder="예: 김선생">
    </div>
    <div class="field">
      <label>상담 내용</label>
      <textarea id="cf_content" rows="3"></textarea>
    </div>
    <div class="field">
      <label>다음 상담(예정)일</label>
      <input type="date" id="cf_nextdate">
    </div>
    <div class="field">
      <label>메모</label>
      <textarea id="cf_memo" rows="2"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="counselingCancelBtn">취소</button>
      <button class="btn btn-primary" id="counselingSaveBtn">저장</button>
    </div>
  </div>
</div>

<!-- 학원비 추가/수정 모달 -->
<div class="overlay" id="tuitionOverlay">
  <div class="modal">
    <h2 id="tuitionModalTitle">학원비 추가</h2>
    <input type="hidden" id="tf_id">
    <div class="field">
      <label>학생 *</label>
      <select id="tf_student"></select>
    </div>
    <div class="row2">
      <div class="field">
        <label>해당 월 *</label>
        <input type="month" id="tf_month">
      </div>
      <div class="field">
        <label>금액</label>
        <input type="number" id="tf_amount" placeholder="예: 300000">
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>상태</label>
        <select id="tf_status">
          <option value="미납">미납</option>
          <option value="납부완료">납부완료</option>
        </select>
      </div>
      <div class="field">
        <label>결제수단</label>
        <select id="tf_method">
          <option value="">선택 안 함</option>
          <option value="카드">카드</option>
          <option value="현금">현금</option>
          <option value="계좌이체">계좌이체</option>
          <option value="기타">기타</option>
        </select>
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>수강 시작일</label>
        <input type="date" id="tf_start">
      </div>
      <div class="field">
        <label>수강 종료일</label>
        <input type="date" id="tf_end">
      </div>
    </div>
    <div class="field">
      <label>납부일</label>
      <input type="date" id="tf_paiddate">
    </div>
    <div class="field">
      <label>메모</label>
      <textarea id="tf_memo" rows="2"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="tuitionCancelBtn">취소</button>
      <button class="btn btn-primary" id="tuitionSaveBtn">저장</button>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">학생 추가</h2>
    <input type="hidden" id="editId">
    <div class="field">
      <label>이름 *</label>
      <input type="text" id="f_name" placeholder="예: 김민준">
    </div>
    <div class="row2">
      <div class="field">
        <label>생년월일</label>
        <input type="date" id="f_birth">
      </div>
      <div class="field">
        <label>학년</label>
        <input type="text" id="f_grade" placeholder="예: 초등 3학년">
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>반 이름</label>
        <input type="text" id="f_class" placeholder="예: 초등 3반">
      </div>
      <div class="field">
        <label>상태</label>
        <select id="f_status">
          <option value="재원">재원</option>
          <option value="퇴원">퇴원</option>
        </select>
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>학생 연락처</label>
        <input type="text" id="f_sphone" placeholder="010-0000-0000">
      </div>
      <div class="field">
        <label>학부모 연락처</label>
        <input type="text" id="f_pphone" placeholder="010-0000-0000">
      </div>
    </div>
    <div class="field">
      <label>입학일</label>
      <input type="date" id="f_enroll">
    </div>
    <div class="field">
      <label>메모</label>
      <textarea id="f_memo" rows="3" placeholder="특이사항, 상담 내용 등"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="cancelBtn">취소</button>
      <button class="btn btn-primary" id="saveBtn">저장</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ====== 여기에 원장님의 Supabase 정보가 이미 입력되어 있어요 ======
  const SUPABASE_URL = "https://cmiqzaiyugpavsogbaem.supabase.co";
  const SUPABASE_KEY = "sb_publishable_mD7DX7CPddlYx5r6Cep_sQ_G3WF0SLj";
  // ================================================================

  window.addEventListener('error', (e) => {
    console.error(e.error || e.message);
    alert('화면에 오류가 발생했어요: ' + (e.message || e.error));
  });

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let students = [];
  let currentFilter = "all";
  let currentSearch = "";

  const tbody = document.getElementById('tbody');
  const emptyState = document.getElementById('emptyState');
  const overlay = document.getElementById('overlay');
  const toast = document.getElementById('toast');
  const statRow = document.getElementById('statRow');

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(()=> toast.classList.remove('show'), 2200);
  }

  function openModal(student){
    document.getElementById('modalTitle').textContent = student ? '학생 정보 수정' : '학생 추가';
    document.getElementById('editId').value = student ? student.id : '';
    document.getElementById('f_name').value = student?.name || '';
    document.getElementById('f_birth').value = student?.birth_date || '';
    document.getElementById('f_grade').value = student?.grade || '';
    document.getElementById('f_class').value = student?.class_name || '';
    document.getElementById('f_status').value = student?.status || '재원';
    document.getElementById('f_sphone').value = student?.student_phone || '';
    document.getElementById('f_pphone').value = student?.parent_phone || '';
    document.getElementById('f_enroll').value = student?.enrollment_date || '';
    document.getElementById('f_memo').value = student?.memo || '';
    overlay.classList.add('show');
  }
  function closeModal(){ overlay.classList.remove('show'); }

  document.getElementById('openAddBtn').onclick = () => openModal(null);
  document.getElementById('cancelBtn').onclick = closeModal;
  overlay.addEventListener('click', (e) => { if(e.target === overlay) closeModal(); });

  document.getElementById('saveBtn').onclick = async () => {
    const name = document.getElementById('f_name').value.trim();
    if(!name){ showToast('이름을 입력해주세요'); return; }

    const payload = {
      name,
      birth_date: document.getElementById('f_birth').value || null,
      grade: document.getElementById('f_grade').value || null,
      class_name: document.getElementById('f_class').value || null,
      status: document.getElementById('f_status').value,
      student_phone: document.getElementById('f_sphone').value || null,
      parent_phone: document.getElementById('f_pphone').value || null,
      enrollment_date: document.getElementById('f_enroll').value || null,
      memo: document.getElementById('f_memo').value || null,
    };

    const editId = document.getElementById('editId').value;
    let error;
    if(editId){
      ({ error } = await sb.from('students').update(payload).eq('id', editId));
    } else {
      ({ error } = await sb.from('students').insert(payload));
    }

    if(error){ showToast('저장 실패: ' + error.message); return; }
    showToast(editId ? '수정 완료' : '학생이 추가되었어요');
    closeModal();
    loadStudents();
  };

  async function deleteStudent(id, name){
    if(!confirm(`${name} 학생 정보를 정말 삭제할까요? 이 작업은 되돌릴 수 없어요.`)) return;
    const { error } = await sb.from('students').delete().eq('id', id);
    if(error){ showToast('삭제 실패: ' + error.message); return; }
    showToast('삭제되었어요');
    loadStudents();
  }

  function render(){
    const filtered = students.filter(s => {
      const matchStatus = currentFilter === 'all' || s.status === currentFilter;
      const matchSearch = !currentSearch || s.name.toLowerCase().includes(currentSearch.toLowerCase());
      return matchStatus && matchSearch;
    });

    tbody.innerHTML = '';
    emptyState.style.display = filtered.length ? 'none' : 'block';

    filtered.forEach(s => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td data-label="이름" class="name-cell">${escapeHtml(s.name)}</td>
        <td data-label="반">${escapeHtml(s.class_name || '-')}</td>
        <td data-label="학년">${escapeHtml(s.grade || '-')}</td>
        <td data-label="생년월일">${s.birth_date || '-'}</td>
        <td data-label="학생 연락처">${s.student_phone || '-'}</td>
        <td data-label="학부모 연락처">${s.parent_phone || '-'}</td>
        <td data-label="입학일">${s.enrollment_date || '-'}</td>
        <td data-label="상태"><span class="badge ${s.status === '재원' ? 'on' : 'off'}">${s.status}</span></td>
        <td data-label="관리">
          <button class="btn btn-ghost btn-sm editBtn">수정</button>
          <button class="btn btn-danger btn-sm delBtn">삭제</button>
        </td>
        <td data-label="메모">${escapeHtml(s.memo || '-')}</td>
      `;
      tr.querySelector('.editBtn').onclick = () => openModal(s);
      tr.querySelector('.delBtn').onclick = () => deleteStudent(s.id, s.name);
      tbody.appendChild(tr);
    });

    const total = students.length;
    const active = students.filter(s => s.status === '재원').length;
    statRow.innerHTML = `
      <div class="stat"><div class="num">${total}</div><div class="label">전체 학생</div></div>
      <div class="stat"><div class="num">${active}</div><div class="label">재원중</div></div>
      <div class="stat"><div class="num">${total - active}</div><div class="label">퇴원</div></div>
    `;
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  async function loadStudents(){
    const { data, error } = await sb
      .from('students')
      .select('*')
      .order('created_at', { ascending: false });

    if(error){
      tbody.innerHTML = '';
      emptyState.style.display = 'block';
      emptyState.innerHTML = `<div class="big">⚠️</div>데이터를 불러오지 못했어요.<br><small>${escapeHtml(error.message)}</small>`;
      return;
    }
    students = data || [];
    render();
  }

  document.getElementById('searchInput').addEventListener('input', (e) => {
    currentSearch = e.target.value;
    render();
  });
  document.getElementById('statusFilter').addEventListener('change', (e) => {
    currentFilter = e.target.value;
    render();
  });

  // ====== 탭 전환 ======
  const tabStudents = document.getElementById('tabStudents');
  const tabAttendance = document.getElementById('tabAttendance');
  const tabTuition = document.getElementById('tabTuition');
  const tabCounseling = document.getElementById('tabCounseling');
  const studentsView = document.getElementById('studentsView');
  const attendanceView = document.getElementById('attendanceView');
  const tuitionView = document.getElementById('tuitionView');
  const counselingView = document.getElementById('counselingView');

  function setActiveTab(activeBtn){
    [tabStudents, tabAttendance, tabTuition, tabCounseling].forEach(b => {
      b.className = (b === activeBtn) ? 'btn btn-primary tabBtn' : 'btn btn-ghost tabBtn';
    });
  }

  function hideAllViews(){
    studentsView.style.display = 'none';
    attendanceView.style.display = 'none';
    tuitionView.style.display = 'none';
    counselingView.style.display = 'none';
  }

  tabStudents.onclick = () => {
    hideAllViews();
    studentsView.style.display = 'block';
    setActiveTab(tabStudents);
  };
  tabAttendance.onclick = () => {
    hideAllViews();
    attendanceView.style.display = 'block';
    setActiveTab(tabAttendance);
    loadAttendance();
  };
  tabTuition.onclick = () => {
    hideAllViews();
    tuitionView.style.display = 'block';
    setActiveTab(tabTuition);
    loadTuition();
  };
  tabCounseling.onclick = () => {
    hideAllViews();
    counselingView.style.display = 'block';
    setActiveTab(tabCounseling);
    loadInquiries();
  };

  // 상담관리 내부 서브탭 (신규상담 / 재원상담)
  const subTabNewInquiry = document.getElementById('subTabNewInquiry');
  const subTabCounseling = document.getElementById('subTabCounseling');
  const newInquiryView = document.getElementById('newInquiryView');
  const existingCounselingView = document.getElementById('existingCounselingView');

  subTabNewInquiry.onclick = () => {
    newInquiryView.style.display = 'block';
    existingCounselingView.style.display = 'none';
    subTabNewInquiry.className = 'btn btn-primary tabBtn';
    subTabCounseling.className = 'btn btn-ghost tabBtn';
    loadInquiries();
  };
  subTabCounseling.onclick = () => {
    newInquiryView.style.display = 'none';
    existingCounselingView.style.display = 'block';
    subTabCounseling.className = 'btn btn-primary tabBtn';
    subTabNewInquiry.className = 'btn btn-ghost tabBtn';
    loadCounseling();
  };


  // ====== 출결 관련 ======
  const attDateInput = document.getElementById('attDate');
  const attClassFilter = document.getElementById('attClassFilter');
  const attArea = document.getElementById('attArea');
  const ATT_STATUSES = ['출석', '지각', '결석', '조퇴'];

  function todayStr(){
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  attDateInput.value = todayStr();
  attDateInput.addEventListener('change', loadAttendance);
  attClassFilter.addEventListener('change', renderAttendance);

  let attRecords = {}; // student_id -> {status, id}

  function refreshClassFilterOptions(){
    const classes = [...new Set(students.filter(s => s.status === '재원' && s.class_name).map(s => s.class_name))];
    const current = attClassFilter.value;
    attClassFilter.innerHTML = '<option value="all">전체 반</option>' +
      classes.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
    if(classes.includes(current)) attClassFilter.value = current;
  }

  async function loadAttendance(){
    if(!students.length){
      const { data } = await sb.from('students').select('*').order('created_at', { ascending: false });
      students = data || [];
    }
    refreshClassFilterOptions();

    const date = attDateInput.value;
    const { data, error } = await sb.from('attendance').select('*').eq('date', date);
    if(error){
      attArea.innerHTML = `<div class="empty"><div class="big">⚠️</div>출결 기록을 불러오지 못했어요.<br><small>${escapeHtml(error.message)}</small></div>`;
      return;
    }
    attRecords = {};
    (data || []).forEach(r => { attRecords[r.student_id] = r; });
    renderAttendance();
  }

  function renderAttendance(){
    const classFilter = attClassFilter.value;
    const active = students.filter(s => s.status === '재원' && (classFilter === 'all' || s.class_name === classFilter));

    if(!active.length){
      attArea.innerHTML = `<div class="empty"><div class="big">🙂</div>표시할 재원생이 없어요.</div>`;
      return;
    }

    attArea.innerHTML = '';
    const table = document.createElement('table');
    table.innerHTML = `<thead><tr><th>이름</th><th>반</th><th>출결 상태</th><th>사유/메모</th></tr></thead>`;
    const tb = document.createElement('tbody');

    active.forEach(s => {
      const tr = document.createElement('tr');
      const rec = attRecords[s.id];
      const btns = ATT_STATUSES.map(st => {
        const isActive = rec && rec.status === st;
        return `<button type="button" class="btn btn-sm attStatusBtn ${isActive ? 'btn-primary' : 'btn-ghost'}" data-status="${st}">${st}</button>`;
      }).join(' ');
      tr.innerHTML = `
        <td data-label="이름" class="name-cell">${escapeHtml(s.name)}</td>
        <td data-label="반">${escapeHtml(s.class_name || '-')}</td>
        <td data-label="출결 상태">${btns}</td>
        <td data-label="사유/메모"><input type="text" class="attMemoInput" placeholder="예: 몸살로 결석" value="${escapeHtml(rec?.memo || '')}" style="width:100%; font-family:inherit; font-size:13.5px; padding:7px 10px; border-radius:8px; border:1px solid var(--line); background:var(--bg);"></td>
      `;
      tr.querySelectorAll('.attStatusBtn').forEach(btn => {
        btn.onclick = () => {
          const already = rec && rec.status === btn.dataset.status;
          const memoVal = tr.querySelector('.attMemoInput').value;
          if(already){
            clearAttendance(s.id);
          } else {
            setAttendance(s.id, btn.dataset.status, memoVal);
          }
        };
      });
      tr.querySelector('.attMemoInput').addEventListener('blur', (e) => {
        const status = (attRecords[s.id] && attRecords[s.id].status) || '출석';
        setAttendance(s.id, status, e.target.value, true);
      });
      tb.appendChild(tr);
    });
    table.appendChild(tb);
    attArea.appendChild(table);
  }

  async function setAttendance(studentId, status, memo, isMemoOnlySave){
    const date = attDateInput.value;
    const payload = { student_id: studentId, date, status };
    if(memo !== undefined) payload.memo = memo || null;
    const { data, error } = await sb.from('attendance')
      .upsert(payload, { onConflict: 'student_id,date' })
      .select();
    if(error){ showToast('출결 저장 실패: ' + error.message); return; }
    if(data && data[0]) attRecords[studentId] = data[0];
    if(isMemoOnlySave){
      showToast('메모가 저장됐어요');
    } else {
      renderAttendance();
      showToast(`${status} 처리됐어요`);
    }
  }

  async function clearAttendance(studentId){
    const date = attDateInput.value;
    const { error } = await sb.from('attendance').delete().eq('student_id', studentId).eq('date', date);
    if(error){ showToast('초기화 실패: ' + error.message); return; }
    delete attRecords[studentId];
    renderAttendance();
    showToast('체크가 지워졌어요');
  }

  // ====== 학원비 관련 ======
  const tuitionOverlay = document.getElementById('tuitionOverlay');
  const tuitionMonthInput = document.getElementById('tuitionMonth');
  const tuitionStatusFilter = document.getElementById('tuitionStatusFilter');
  const tuitionArea = document.getElementById('tuitionArea');
  const tuitionStatRow = document.getElementById('tuitionStatRow');
  let tuitionRecords = [];

  function currentMonthStr(){
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
  }
  tuitionMonthInput.value = currentMonthStr();
  tuitionMonthInput.addEventListener('change', loadTuition);
  tuitionStatusFilter.addEventListener('change', renderTuition);

  function fillStudentSelect(){
    const sel = document.getElementById('tf_student');
    const sorted = [...students].sort((a,b) => (a.status === b.status) ? 0 : (a.status === '재원' ? -1 : 1));
    sel.innerHTML = sorted
      .map(s => `<option value="${s.id}">${escapeHtml(s.name)}${s.class_name ? ' · ' + escapeHtml(s.class_name) : ''}${s.status !== '재원' ? ' (퇴원)' : ''}</option>`)
      .join('');
  }

  function openTuitionModal(rec){
    fillStudentSelect();
    document.getElementById('tuitionModalTitle').textContent = rec ? '학원비 수정' : '학원비 추가';
    document.getElementById('tf_id').value = rec ? rec.id : '';
    document.getElementById('tf_student').value = rec ? rec.student_id : (students.find(s=>s.status==='재원')?.id || '');
    document.getElementById('tf_month').value = rec ? rec.month : tuitionMonthInput.value;
    document.getElementById('tf_amount').value = rec ? rec.amount : '';
    document.getElementById('tf_status').value = rec ? rec.status : '미납';
    document.getElementById('tf_method').value = rec?.payment_method || '';
    document.getElementById('tf_start').value = rec?.period_start || '';
    document.getElementById('tf_end').value = rec?.period_end || '';
    document.getElementById('tf_paiddate').value = rec?.paid_date || '';
    document.getElementById('tf_memo').value = rec?.memo || '';
    tuitionOverlay.classList.add('show');
  }
  function closeTuitionModal(){ tuitionOverlay.classList.remove('show'); }

  document.getElementById('openTuitionAddBtn').onclick = () => openTuitionModal(null);
  document.getElementById('genTuitionBtn').onclick = async () => {
    if(!confirm('이번 달 학원비가 없는 재원생 전체에 대해 새로 생성할까요? (지난달 금액을 그대로 가져와요)')) return;
    const { error } = await sb.rpc('generate_monthly_tuition');
    if(error){ showToast('생성 실패: ' + error.message); return; }
    showToast('이번달 학원비가 생성됐어요');
    loadTuition();
  };
  document.getElementById('tuitionCancelBtn').onclick = closeTuitionModal;
  tuitionOverlay.addEventListener('click', (e) => { if(e.target === tuitionOverlay) closeTuitionModal(); });

  document.getElementById('tuitionSaveBtn').onclick = async () => {
    const studentId = document.getElementById('tf_student').value;
    const month = document.getElementById('tf_month').value;
    if(!studentId || !month){ showToast('학생과 해당 월을 선택해주세요'); return; }

    const payload = {
      student_id: studentId,
      month,
      amount: Number(document.getElementById('tf_amount').value) || 0,
      status: document.getElementById('tf_status').value,
      payment_method: document.getElementById('tf_method').value || null,
      period_start: document.getElementById('tf_start').value || null,
      period_end: document.getElementById('tf_end').value || null,
      paid_date: document.getElementById('tf_paiddate').value || null,
      memo: document.getElementById('tf_memo').value || null,
    };

    const editId = document.getElementById('tf_id').value;
    let error;
    if(editId){
      ({ error } = await sb.from('tuition').update(payload).eq('id', editId));
    } else {
      ({ error } = await sb.from('tuition').upsert(payload, { onConflict: 'student_id,month' }));
    }
    if(error){ showToast('저장 실패: ' + error.message); return; }
    showToast('저장됐어요');
    closeTuitionModal();
    loadTuition();
  };

  async function deleteTuition(id){
    if(!confirm('이 학원비 기록을 삭제할까요?')) return;
    const { error } = await sb.from('tuition').delete().eq('id', id);
    if(error){ showToast('삭제 실패: ' + error.message); return; }
    showToast('삭제됐어요');
    loadTuition();
  }

  async function loadTuition(){
    if(!students.length){
      const { data } = await sb.from('students').select('*').order('created_at', { ascending: false });
      students = data || [];
    }
    const month = tuitionMonthInput.value;
    const { data, error } = await sb.from('tuition').select('*').eq('month', month);
    if(error){
      tuitionArea.innerHTML = `<div class="empty"><div class="big">⚠️</div>학원비 정보를 불러오지 못했어요.<br><small>${escapeHtml(error.message)}</small></div>`;
      return;
    }
    tuitionRecords = data || [];
    renderTuition();
  }

  function renderTuition(){
    const filterStatus = tuitionStatusFilter.value;
    const filtered = tuitionRecords.filter(r => filterStatus === 'all' || r.status === filterStatus);

    const paidCount = tuitionRecords.filter(r => r.status === '납부완료').length;
    const unpaidCount = tuitionRecords.filter(r => r.status === '미납').length;
    const totalAmount = tuitionRecords.filter(r => r.status === '납부완료').reduce((sum,r) => sum + Number(r.amount||0), 0);
    tuitionStatRow.innerHTML = `
      <div class="stat"><div class="num">${paidCount}</div><div class="label">납부완료</div></div>
      <div class="stat"><div class="num">${unpaidCount}</div><div class="label">미납</div></div>
      <div class="stat"><div class="num">${totalAmount.toLocaleString()}원</div><div class="label">이번달 수납액</div></div>
    `;

    if(!filtered.length){
      tuitionArea.innerHTML = `<div class="empty"><div class="big">💳</div>해당 월의 학원비 기록이 없어요. [+ 학원비 추가]로 등록해보세요.</div>`;
      return;
    }

    const table = document.createElement('table');
    table.innerHTML = `<thead><tr>
      <th>학생</th><th>금액</th><th>상태</th><th>결제수단</th><th>수강기간</th><th>납부일</th><th>관리</th><th>메모</th>
    </tr></thead>`;
    const tb = document.createElement('tbody');

    filtered.forEach(r => {
      const student = students.find(s => s.id === r.student_id);
      const period = (r.period_start || r.period_end) ? `${r.period_start||'-'} ~ ${r.period_end||'-'}` : '-';
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td data-label="학생" class="name-cell">${escapeHtml(student ? student.name : '(삭제된 학생)')}</td>
        <td data-label="금액">${Number(r.amount||0).toLocaleString()}원</td>
        <td data-label="상태"><span class="badge ${r.status === '납부완료' ? 'on' : 'off'}">${r.status}</span></td>
        <td data-label="결제수단">${r.payment_method || '-'}</td>
        <td data-label="수강기간">${period}</td>
        <td data-label="납부일">${r.paid_date || '-'}</td>
        <td data-label="관리">
          <button class="btn btn-ghost btn-sm editTuitionBtn">수정</button>
          <button class="btn btn-danger btn-sm delTuitionBtn">삭제</button>
        </td>
        <td data-label="메모">${escapeHtml(r.memo || '-')}</td>
      `;
      tr.querySelector('.editTuitionBtn').onclick = () => openTuitionModal(r);
      tr.querySelector('.delTuitionBtn').onclick = () => deleteTuition(r.id);
      tb.appendChild(tr);
    });
    table.appendChild(tb);
    tuitionArea.innerHTML = '';
    tuitionArea.appendChild(table);
  }

  // ====== 신규상담(new_inquiry) 관련 ======
  const inquiryOverlay = document.getElementById('inquiryOverlay');
  const inquiryArea = document.getElementById('inquiryArea');
  const inquirySearchInput = document.getElementById('inquirySearchInput');
  const inquiryStatusFilter = document.getElementById('inquiryStatusFilter');
  let inquiries = [];
  let inquirySearch = '';
  let inquiryFilterStatus = 'all';

  function openInquiryModal(rec){
    document.getElementById('inquiryModalTitle').textContent = rec ? '신규상담 수정' : '신규상담 추가';
    document.getElementById('if_id').value = rec ? rec.id : '';
    document.getElementById('if_name').value = rec?.name || '';
    document.getElementById('if_status').value = rec?.status || '상담중';
    document.getElementById('if_phone').value = rec?.phone || '';
    document.getElementById('if_pphone').value = rec?.parent_phone || '';
    document.getElementById('if_interested').value = rec?.interested_class || '';
    document.getElementById('if_source').value = rec?.source || '';
    document.getElementById('if_date').value = rec?.date || todayStr();
    document.getElementById('if_counselor').value = rec?.counselor || '';
    document.getElementById('if_content').value = rec?.content || '';
    document.getElementById('if_leveltest').value = rec?.level_test_result || '';
    document.getElementById('if_assigned').value = rec?.assigned_class || '';
    document.getElementById('if_nextdate').value = rec?.next_date || '';
    document.getElementById('if_memo').value = rec?.memo || '';
    inquiryOverlay.classList.add('show');
  }
  function closeInquiryModal(){ inquiryOverlay.classList.remove('show'); }

  document.getElementById('openInquiryAddBtn').onclick = () => openInquiryModal(null);
  document.getElementById('inquiryCancelBtn').onclick = closeInquiryModal;
  inquiryOverlay.addEventListener('click', (e) => { if(e.target === inquiryOverlay) closeInquiryModal(); });

  document.getElementById('inquirySaveBtn').onclick = async () => {
    const name = document.getElementById('if_name').value.trim();
    if(!name){ showToast('이름을 입력해주세요'); return; }
    const payload = {
      name,
      status: document.getElementById('if_status').value,
      phone: document.getElementById('if_phone').value || null,
      parent_phone: document.getElementById('if_pphone').value || null,
      interested_class: document.getElementById('if_interested').value || null,
      source: document.getElementById('if_source').value || null,
      date: document.getElementById('if_date').value || null,
      counselor: document.getElementById('if_counselor').value || null,
      content: document.getElementById('if_content').value || null,
      level_test_result: document.getElementById('if_leveltest').value || null,
      assigned_class: document.getElementById('if_assigned').value || null,
      next_date: document.getElementById('if_nextdate').value || null,
      memo: document.getElementById('if_memo').value || null,
    };
    const editId = document.getElementById('if_id').value;
    let error;
    if(editId){
      ({ error } = await sb.from('new_inquiry').update(payload).eq('id', editId));
    } else {
      ({ error } = await sb.from('new_inquiry').insert(payload));
    }
    if(error){ showToast('저장 실패: ' + error.message); return; }
    showToast('저장됐어요');
    closeInquiryModal();
    loadInquiries();
  };

  async function deleteInquiry(id){
    if(!confirm('이 상담 기록을 삭제할까요?')) return;
    const { error } = await sb.from('new_inquiry').delete().eq('id', id);
    if(error){ showToast('삭제 실패: ' + error.message); return; }
    showToast('삭제됐어요');
    loadInquiries();
  }

  async function loadInquiries(){
    const { data, error } = await sb.from('new_inquiry').select('*').order('date', { ascending: false });
    if(error){
      inquiryArea.innerHTML = `<div class="empty"><div class="big">⚠️</div>불러오지 못했어요.<br><small>${escapeHtml(error.message)}</small></div>`;
      return;
    }
    inquiries = data || [];
    renderInquiries();
  }

  function renderInquiries(){
    const filtered = inquiries.filter(r => {
      const matchStatus = inquiryFilterStatus === 'all' || r.status === inquiryFilterStatus;
      const matchSearch = !inquirySearch || r.name.toLowerCase().includes(inquirySearch.toLowerCase());
      return matchStatus && matchSearch;
    });
    if(!filtered.length){
      inquiryArea.innerHTML = `<div class="empty"><div class="big">📋</div>신규상담 기록이 없어요. [+ 신규상담 추가]로 시작해보세요.</div>`;
      return;
    }
    const table = document.createElement('table');
    table.innerHTML = `<thead><tr>
      <th>이름</th><th>연락처</th><th>관심반</th><th>경로</th><th>상담일</th><th>상태</th><th>레벨테스트</th><th>배정반</th><th>관리</th>
    </tr></thead>`;
    const tb = document.createElement('tbody');
    filtered.forEach(r => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td data-label="이름" class="name-cell">${escapeHtml(r.name)}</td>
        <td data-label="연락처">${r.phone || '-'}</td>
        <td data-label="관심반">${r.interested_class || '-'}</td>
        <td data-label="경로">${r.source || '-'}</td>
        <td data-label="상담일">${r.date || '-'}</td>
        <td data-label="상태"><span class="badge ${r.status === '등록완료' ? 'on' : 'off'}">${r.status}</span></td>
        <td data-label="레벨테스트">${r.level_test_result || '-'}</td>
        <td data-label="배정반">${r.assigned_class || '-'}</td>
        <td data-label="관리">
          <button class="btn btn-ghost btn-sm editInquiryBtn">수정</button>
          <button class="btn btn-danger btn-sm delInquiryBtn">삭제</button>
        </td>
      `;
      tr.querySelector('.editInquiryBtn').onclick = () => openInquiryModal(r);
      tr.querySelector('.delInquiryBtn').onclick = () => deleteInquiry(r.id);
      tb.appendChild(tr);
    });
    table.appendChild(tb);
    inquiryArea.innerHTML = '';
    inquiryArea.appendChild(table);
  }

  inquirySearchInput.addEventListener('input', (e) => { inquirySearch = e.target.value; renderInquiries(); });
  inquiryStatusFilter.addEventListener('change', (e) => { inquiryFilterStatus = e.target.value; renderInquiries(); });

  // ====== 재원상담(counseling) 관련 ======
  const counselingOverlay = document.getElementById('counselingOverlay');
  const counselingArea = document.getElementById('counselingArea');
  const counselingStudentFilter = document.getElementById('counselingStudentFilter');
  let counselingRecords = [];

  function fillCounselingStudentSelects(){
    const sorted = [...students].sort((a,b) => (a.status === b.status) ? 0 : (a.status === '재원' ? -1 : 1));
    const options = sorted.map(s => `<option value="${s.id}">${escapeHtml(s.name)}${s.class_name ? ' · ' + escapeHtml(s.class_name) : ''}${s.status !== '재원' ? ' (퇴원)' : ''}</option>`).join('');
    document.getElementById('cf_student').innerHTML = options;
    const current = counselingStudentFilter.value;
    counselingStudentFilter.innerHTML = '<option value="all">전체 학생</option>' + options;
    if([...counselingStudentFilter.options].some(o => o.value === current)) counselingStudentFilter.value = current;
  }

  function openCounselingModal(rec){
    fillCounselingStudentSelects();
    document.getElementById('counselingModalTitle').textContent = rec ? '상담 수정' : '상담 추가';
    document.getElementById('cf_id').value = rec ? rec.id : '';
    document.getElementById('cf_student').value = rec ? rec.student_id : (students.find(s=>s.status==='재원')?.id || '');
    document.getElementById('cf_date').value = rec?.date || todayStr();
    document.getElementById('cf_type').value = rec?.type || '전화';
    document.getElementById('cf_counselor').value = rec?.counselor || '';
    document.getElementById('cf_content').value = rec?.content || '';
    document.getElementById('cf_nextdate').value = rec?.next_date || '';
    document.getElementById('cf_memo').value = rec?.memo || '';
    counselingOverlay.classList.add('show');
  }
  function closeCounselingModal(){ counselingOverlay.classList.remove('show'); }

  document.getElementById('openCounselingAddBtn').onclick = () => openCounselingModal(null);
  document.getElementById('counselingCancelBtn').onclick = closeCounselingModal;
  counselingOverlay.addEventListener('click', (e) => { if(e.target === counselingOverlay) closeCounselingModal(); });

  document.getElementById('counselingSaveBtn').onclick = async () => {
    const studentId = document.getElementById('cf_student').value;
    if(!studentId){ showToast('학생을 선택해주세요'); return; }
    const payload = {
      student_id: studentId,
      date: document.getElementById('cf_date').value || todayStr(),
      type: document.getElementById('cf_type').value,
      counselor: document.getElementById('cf_counselor').value || null,
      content: document.getElementById('cf_content').value || null,
      next_date: document.getElementById('cf_nextdate').value || null,
      memo: document.getElementById('cf_memo').value || null,
    };
    const editId = document.getElementById('cf_id').value;
    let error;
    if(editId){
      ({ error } = await sb.from('counseling').update(payload).eq('id', editId));
    } else {
      ({ error } = await sb.from('counseling').insert(payload));
    }
    if(error){ showToast('저장 실패: ' + error.message); return; }
    showToast('저장됐어요');
    closeCounselingModal();
    loadCounseling();
  };

  async function deleteCounseling(id){
    if(!confirm('이 상담 기록을 삭제할까요?')) return;
    const { error } = await sb.from('counseling').delete().eq('id', id);
    if(error){ showToast('삭제 실패: ' + error.message); return; }
    showToast('삭제됐어요');
    loadCounseling();
  }

  async function loadCounseling(){
    if(!students.length){
      const { data } = await sb.from('students').select('*').order('created_at', { ascending: false });
      students = data || [];
    }
    fillCounselingStudentSelects();
    const { data, error } = await sb.from('counseling').select('*').order('date', { ascending: false });
    if(error){
      counselingArea.innerHTML = `<div class="empty"><div class="big">⚠️</div>불러오지 못했어요.<br><small>${escapeHtml(error.message)}</small></div>`;
      return;
    }
    counselingRecords = data || [];
    renderCounseling();
  }

  function renderCounseling(){
    const filterStudent = counselingStudentFilter.value;
    const filtered = counselingRecords.filter(r => filterStudent === 'all' || r.student_id === filterStudent);
    if(!filtered.length){
      counselingArea.innerHTML = `<div class="empty"><div class="big">💬</div>상담 기록이 없어요. [+ 상담 추가]로 시작해보세요.</div>`;
      return;
    }
    const table = document.createElement('table');
    table.innerHTML = `<thead><tr>
      <th>학생</th><th>상담일</th><th>방식</th><th>상담자</th><th>내용</th><th>다음상담</th><th>관리</th>
    </tr></thead>`;
    const tb = document.createElement('tbody');
    filtered.forEach(r => {
      const student = students.find(s => s.id === r.student_id);
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td data-label="학생" class="name-cell">${escapeHtml(student ? student.name : '(삭제된 학생)')}</td>
        <td data-label="상담일">${r.date || '-'}</td>
        <td data-label="방식">${r.type || '-'}</td>
        <td data-label="상담자">${r.counselor || '-'}</td>
        <td data-label="내용">${escapeHtml(r.content || '-')}</td>
        <td data-label="다음상담">${r.next_date || '-'}</td>
        <td data-label="관리">
          <button class="btn btn-ghost btn-sm editCounselingBtn">수정</button>
          <button class="btn btn-danger btn-sm delCounselingBtn">삭제</button>
        </td>
      `;
      tr.querySelector('.editCounselingBtn').onclick = () => openCounselingModal(r);
      tr.querySelector('.delCounselingBtn').onclick = () => deleteCounseling(r.id);
      tb.appendChild(tr);
    });
    table.appendChild(tb);
    counselingArea.innerHTML = '';
    counselingArea.appendChild(table);
  }

  counselingStudentFilter.addEventListener('change', renderCounseling);

  // ====== 로그인 관련 ======
  const loginScreen = document.getElementById('loginScreen');
  const mainScreen = document.getElementById('mainScreen');
  const loginError = document.getElementById('loginError');

  function showApp(){
    loginScreen.style.display = 'none';
    mainScreen.style.display = 'block';
    loadStudents();
  }
  function showLogin(){
    loginScreen.style.display = 'flex';
    mainScreen.style.display = 'none';
  }

  document.getElementById('loginBtn').onclick = async () => {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    loginError.style.display = 'none';

    if(!email || !password){
      loginError.textContent = '이메일과 비밀번호를 모두 입력해주세요';
      loginError.style.display = 'block';
      return;
    }

    const { error } = await sb.auth.signInWithPassword({ email, password });
    if(error){
      loginError.textContent = '로그인 실패: 이메일 또는 비밀번호를 확인해주세요';
      loginError.style.display = 'block';
      return;
    }
    showApp();
  };

  document.getElementById('logoutBtn').onclick = async () => {
    await sb.auth.signOut();
    showLogin();
  };

  // 엔터키로도 로그인 가능하게
  document.getElementById('loginPassword').addEventListener('keydown', (e) => {
    if(e.key === 'Enter') document.getElementById('loginBtn').click();
  });

  // 페이지 열었을 때 이미 로그인 되어있는지 확인
  (async () => {
    const { data: { session } } = await sb.auth.getSession();
    if(session){ showApp(); } else { showLogin(); }
  })();
</script>
</body>
</html>
